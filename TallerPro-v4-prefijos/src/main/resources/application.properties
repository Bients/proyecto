# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite (carpeta personal del usuario, necesario para el instalador)
# Version 2.0 usa un archivo nuevo para no chocar con el esquema de la 1.0
taller.datos.directorio=${user.home}/.taller-pro
spring.datasource.url=jdbc:sqlite:${taller.datos.directorio}/tallerpro-v2.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite declara la clave de fila como INTEGER incluso si la entidad usa Long.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.ejemplo.tallerpro=INFO

# Datos del taller (aparecen en el PDF de la orden)
taller.nombre=TallerPro

# Modelo de Claude para el diagnostico con IA (se puede cambiar aqui)
taller.ia.modelo=claude-sonnet-5-5
